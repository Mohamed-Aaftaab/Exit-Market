name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Contracts: unit, fuzz, invariant and regression tests (fork tests need RPC access and run with FORK_TESTS=1).
      - run: npx hardhat test solidity
      # The committed ABI module must match what the contracts compile to.
      - run: node scripts/dev/exportAbis.ts && git diff --exit-code scripts/lib/abis.ts
      - run: npm run typecheck
      - run: npm run test:lib
      - run: npm run test:web
      - run: npm run lint -w web
      # The app builds with no configuration: addresses come from deployments/arbitrumSepolia.json.
      - run: npm run build -w web

  # The Stylus port of the proof core: its Rust tests (one rebuilds a live Xai Testnet send root from a real
  # withdrawal). They run on Linux; natively on Windows the MSVC linker rejects the WASM library's Stylus host imports.
  stylus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: stylus/exit-proof
    steps:
      - uses: actions/checkout@v5
      # The toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo test --locked